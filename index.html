<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доска качеров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .member-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }
        
        .member-card:hover {
            transform: translateY(-5px);
        }
        
        .member-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .status {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .status.done {
            background: #4caf50;
        }
        
        .status.progress {
            background: #ff9800;
        }
        
        .status.waiting {
            background: #9c27b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Доска качеров Genshin Impact</h1>
        
        <div class="board">
            <div class="member-card">
                <h3>Игрок 1</h3>
                <p>Статус: в процессе</p>
                <span class="status progress">🔄 В процессе</span>
            </div>
            
            <div class="member-card">
                <h3>Игрок 2</h3>
                <p>Статус: ожидает</p>
                <span class="status waiting">⏳ Ожидает</span>
            </div>
            
            <div class="member-card">
                <h3>Игрок 3</h3>
                <p>Статус: готово</p>
                <span class="status done">✅ Готово</span>
            </div>
        </div>
    </div>
</body>
</html>
