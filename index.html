<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZhuCareKachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="home" class="view">
  <header class="hero">
    <h1 id="welcomeTitle"></h1>
    <p id="welcomeText"></p>
    <a id="tg" class="pill" target="_blank" rel="noopener"></a>
  </header>
  <section class="choose">
    <h2 id="chooseTitle"></h2>
    <p id="chooseHint" class="hint"></p>
    <div class="carousel">
      <button class="arrow" id="prev" aria-label="Влево">&#8249;</button>
      <div class="track" id="track"></div>
      <button class="arrow" id="next" aria-label="Вправо">&#8250;</button>
    </div>
  </section>
</main>

<main id="person" class="view" hidden>
  <a href="#" class="back" id="back"></a>
  <section class="profile" id="profile"></section>
  <h2 id="ordersTitle" class="orders-title"></h2>
  <div id="orders" class="orders"></div>
</main>

<footer id="footer"></footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
